name: Employee Reporting System CI/CD

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and Test Employee Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Lab 6: Run automated JUnit tests
      - name: Run Unit Tests
        run: mvn -B -Dtest=com.napier.sem.MainTest test

      # Package the application after successful tests
      - name: Build Application with Maven
        run: mvn -B clean package -DskipTests

      - name: Build Docker Images
        run: docker compose build

      - name: Start MySQL Database
        run: docker compose up -d db

      - name: Wait for MySQL to Become Healthy
        run: |
          for i in {1..60}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q db)")

            if [ "$STATUS" = "healthy" ]; then
              echo "MySQL is healthy!"
              exit 0
            fi

            echo "Waiting for MySQL... ($i/60)"
            sleep 10
          done

          echo "MySQL failed to become healthy."
          docker compose logs db
          exit 1
          
        
       # Lab 7: Run integration tests against MySQL
      - name: Run Integration Tests
        run: mvn -B -Dtest=com.napier.sem.MainIntegrationTest test

      # Lab 7: Generate JaCoCo coverage report
      - name: Generate JaCoCo Coverage Report
        run: mvn -B jacoco:report

      # Lab 7: Upload code coverage results to Codecov
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
          verbose: true


      - name: Run Employee Application
        run: docker compose run --rm --no-deps app

      - name: Show Container Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Stop Containers
        if: always()
        run: docker compose down