name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Build with Maven
        run: mvn package

      - name: Create Docker Network
        run: docker network create se-methods

      - name: Start MongoDB Container
        run: docker run -d --name mongodb --network se-methods mongo:4.4

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if docker exec mongodb mongo --quiet --eval "db.runCommand({ ping: 1 }).ok" | grep -q '^1'; then
              echo "MongoDB is ready!"
              exit 0
            fi
            echo "Waiting for MongoDB..."
            sleep 2
          done
          echo "MongoDB failed to become ready."
          exit 1

      - name: Build Docker Image
        run: docker build -t semimage .

      - name: Run Docker Container
        run: |
          docker run --rm \
            --network se-methods \
            -e MONGO_URI=mongodb://mongodb:27017 \
            semimage