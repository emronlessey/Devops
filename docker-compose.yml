services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: employees
      MYSQL_USER: root
      MYSQL_PASSWORD: example

  db:
    build: ./db
    environment:
      MYSQL_ROOT_PASSWORD: example
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -p$$MYSQL_ROOT_PASSWORD -D employees -e 'SELECT COUNT(*) FROM employees.employees' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s